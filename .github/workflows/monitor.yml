name: Monitor

# Monthly update: fetch new filings for tracked companies, process only what's new
# (everything else is served from the committed output cache at $0), re-verify, publish.
# Spends API credit through the budget guard: a run whose worst case is above $0.50 stops
# (no --confirm here), so a big run always needs a human. Off until MONITOR_ENABLED=true.

on:
  schedule:
    - cron: "0 12 25 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  monitor:
    if: vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AIPAYBACK_API_KEY: ${{ secrets.AIPAYBACK_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      AIPAYBACK_DEVICE: github-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: SEC download cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sec-raw-${{ hashFiles('data/manifests/filings.jsonl') }}
          restore-keys: sec-raw-
      - name: Rebuild from committed files ($0)
        run: uv run aipb restore
      - name: New filings, then the paid stages (cached work is free)
        run: |
          uv run aipb ingest
          uv run aipb parse
          uv run aipb prefilter
          uv run aipb filter
          uv run aipb extract
          uv run aipb verify
          uv run aipb explain
          uv run aipb publish
      - name: Budget
        if: always()
        run: uv run aipb budget
      - name: Commit outputs, ledger, manifest and site data
        if: always()
        run: |
          git config user.name "aipayback-bot"
          git config user.email "aipayback-bot@users.noreply.github.com"
          git add data/ledger data/outputs data/manifests data/site || true
          git diff --cached --quiet || git commit -m "monitor: monthly update"
          git pull --rebase && git push
