name: Newsletter

# Monthly "AI Promise Watch", fully automatic and fail-closed:
#   1st of the month 14:00 UTC  stage: Buttondown draft + founders' test copy + preview issue
#   2nd of the month 14:00 UTC  send: only if no `hold` label, the draft is unchanged, and
#                               NEWSLETTER_AUTOSEND is "true" (otherwise founders only)
# The first two issues are founders-only regardless (ramp-up). The send log is committed.
#
# Needs secrets BUTTONDOWN_API_KEY, FOUNDER_EMAILS, AIPAYBACK_API_KEY (intro, capped at
# $0.05; without it the intro is template-only), and the repo variable NEWSLETTER_ENABLED.

on:
  schedule:
    - cron: "0 14 1 * *"
    - cron: "0 14 2 * *"
  workflow_dispatch:
    inputs:
      action:
        description: "stage or send"
        required: true
        default: stage
      issue:
        description: "issue key, e.g. free-2026-12 (default: this month)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    if: vars.NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      FOUNDER_EMAILS: ${{ secrets.FOUNDER_EMAILS }}
      AIPAYBACK_API_KEY: ${{ secrets.AIPAYBACK_API_KEY }}
      NEWSLETTER_AUTOSEND: ${{ vars.NEWSLETTER_AUTOSEND }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AIPAYBACK_DEVICE: github-newsletter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Pick the step
        id: step
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_ACTION" in stage|send) echo "action=$INPUT_ACTION" >> "$GITHUB_OUTPUT";;
              *) echo "action must be stage or send" && exit 1;; esac
          elif [ "$(date -u +%d)" = "01" ]; then
            echo "action=stage" >> "$GITHUB_OUTPUT"
          else
            echo "action=send" >> "$GITHUB_OUTPUT"
          fi
      - name: Run
        env:
          ISSUE: ${{ inputs.issue }}
          ACTION: ${{ steps.step.outputs.action }}
        run: |
          if [ -n "$ISSUE" ]; then
            [[ "$ISSUE" =~ ^[a-z]+-[0-9]{4}-[0-9]{2}$ ]] || { echo "bad issue key"; exit 1; }
            uv run aipb "newsletter-$ACTION" --issue "$ISSUE"
          else
            uv run aipb "newsletter-$ACTION"
          fi
      - name: Commit the send log and ledger
        if: always()
        run: |
          git config user.name "aipayback-bot"
          git config user.email "aipayback-bot@users.noreply.github.com"
          git add data/sends data/ledger data/outputs || true
          git diff --cached --quiet || git commit -m "newsletter: send log"
          git pull --rebase && git push
