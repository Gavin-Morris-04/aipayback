# Machine version of docs/finance/EVIDENCE_MAP.md (Nick's final map, 2026-11-11). Change
# both together. Verification pulls these XBRL measures for each claim type and computes
# every number in code; the model only reads the computed table.
#
# Tags are tried in order; the first one a company reports is used (companies tag the
# same idea differently: JPM reports NoninterestExpense, not SG&A).

version: em3

# em3 (2026-11-11, D41): Nick's final evidence map merged with the em2 coverage check.
# - Nick named the same capex and R&D fallbacks em2 had added; both stay last in line.
# - CostsAndExpenses stays the last operating-expense fallback (AMZN, FDX, META report
#   no operating-expense or SG&A line). Code labels it "total costs and expenses", and
#   Nick's rule makes total expenses context only, never enough to decide a savings promise.
# - gross_profit falls back to revenue minus cost_of_revenue in code (verify/numbers.py).
# - Capex definition pieces (finance-lease payments, capitalized software, asset-sale
#   proceeds) are shown next to capex, so a promise's own definition can be matched.
measures:
  revenue: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax]
  operating_expenses: [OperatingExpenses, SellingGeneralAndAdministrativeExpense, NoninterestExpense, CostsAndExpenses]
  restructuring: [RestructuringCharges, SeveranceCosts1]
  gross_profit: [GrossProfit]
  cost_of_revenue: [CostOfRevenue, CostOfGoodsAndServicesSold]
  operating_income: [OperatingIncomeLoss]
  capex: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
  finance_lease_principal: [FinanceLeasePrincipalPayments]
  capitalized_software: [PaymentsToDevelopSoftware]
  ppe_sale_proceeds: [ProceedsFromSaleOfPropertyPlantAndEquipment]
  rnd: [ResearchAndDevelopmentExpense, ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost]

# Ratios computed in code from the measures above (numerator / denominator).
ratios:
  gross_margin: {numerator: gross_profit, denominator: revenue}
  operating_margin: {numerator: operating_income, denominator: revenue}

claim_types:
  cost_savings:
    measures: [operating_expenses, restructuring]
    search_terms: [savings, run-rate, productivity, efficiency, cost, expenses, reduction]
  margin:
    measures: [gross_profit, operating_income, revenue]
    ratios: [gross_margin, operating_margin]
    search_terms: [margin, gross, operating, expansion, points]
  revenue:
    measures: [revenue]
    search_terms: [revenue, bookings, "book of business", sales, growth]
  workforce:
    measures: []
    search_terms: [employees, headcount, workforce, "human capital", positions, roles, attrition]
  capex_investment:
    measures: [capex, finance_lease_principal, capitalized_software, ppe_sale_proceeds, rnd]
    search_terms: ["capital expenditures", capex, "data center", infrastructure, investment]
  productivity:
    measures: [revenue]
    search_terms: [productivity, automated, automation, efficiency, hours, time]
  product_or_timeline:
    measures: []
    search_terms: [launch, launched, "generally available", available, released, introduced, delivered]
  other:
    measures: []
    search_terms: []
