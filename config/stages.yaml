# Per-stage LLM settings. Every stage sets thinking/effort explicitly: Claude Haiku 5.5
# runs adaptive thinking at effort "medium" by default, and thinking tokens bill as output.
# "disabled" thinking is valid on Haiku 5.5 at effort high or below; Sonnet 5.5 rejects it
# (use "between_tools" or adaptive at low effort there).
#
# `variants` are named overrides for A/B tests (aipb filter/extract --variant NAME). Each
# variant's outputs are cached and stored separately, so comparisons never overwrite the
# default results.

estimator:
  # Conservative chars-per-token (English averages closer to 4). A lower number means a
  # higher estimate. Calibrate against the free count_tokens endpoint once a key exists.
  chars_per_token: 3.0
  safety_margin: 1.15
  per_request_overhead_tokens: 50
  # Hidden tool-use system prompt billed on any request with tools (pricing page:
  # 286 tokens for tool_choice auto, 406 for any/tool on Haiku 5.5). Verified 2026-11-10.
  tool_overhead_tokens: 406

stages:
  smoke:
    model: claude-haiku-5-5
    max_tokens: 16
    thinking: disabled
    batch: false

  filter:
    model: claude-haiku-5-5
    prompt: v1
    max_tokens: 1024          # ~10 passages x ~25 tokens of JSON, with headroom
    thinking: disabled
    effort: low
    batch: true
    group_size: 10            # passages per request, always from the same filing
    # A passage goes on to extraction when the filter says "promise", or is unsure.
    extract_labels: [promise]
    extract_low_confidence: true
    variants:
      effort_low: {thinking: adaptive, effort: low, max_tokens: 4096}

  extract:
    model: claude-haiku-5-5
    prompt: v1
    max_tokens: 2048          # ~8 statements of JSON with headroom (thinking is off)
    thinking: disabled
    effort: low
    batch: true
    quote_retries: 1          # one retry with feedback, then a failing quote is dropped
    variants:
      effort_low: {thinking: adaptive, effort: low, max_tokens: 8192}
      sonnet: {model: claude-sonnet-5-5, thinking: adaptive, effort: low, max_tokens: 8192}

  verify_t1:
    model: claude-haiku-5-5
    prompt: v2   # Nick's final rubric and evidence map (D41)
    max_tokens: 1024
    thinking: disabled
    effort: low
    batch: true
    variants:
      effort_low: {thinking: adaptive, effort: low, max_tokens: 4096}

  verify_t2:                  # the capped agent: escalations and 2nd checks only
    model: claude-haiku-5-5
    prompt: v2   # D41
    max_tokens: 2048          # per turn
    thinking: adaptive
    effort: low
    max_turns: 8
    max_agent_tokens: 60000   # per promise
    run_cap_usd: "0.50"       # per verify run; escalations beyond it stay pending
    variants:
      sonnet: {model: claude-sonnet-5-5}

  explain:
    model: claude-haiku-5-5
    prompt: v2   # D41
    max_tokens: 1024
    thinking: disabled
    effort: low
    batch: true

  newsletter_intro:           # 2-3 sentences, fact-checked; capped by config/newsletter.yaml
    model: claude-haiku-5-5
    prompt: v1
    max_tokens: 300
    thinking: disabled
    effort: low
    batch: false

gate:
  confidence_threshold: 0.75  # below this a status is published as "Status pending review"
