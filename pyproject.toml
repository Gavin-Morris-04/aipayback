[project]
name = "aipayback"
version = "0.1.0"
description = "AIPayback: did the AI promises in SEC filings pay off? Extract, verify and cite."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "httpx2>=2.16.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
aipb = "aipb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipb"]

[tool.uv]
# This machine sits behind a TLS setup that needs the OS certificate store.
system-certs = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: calls a real external API (never run in CI)",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
